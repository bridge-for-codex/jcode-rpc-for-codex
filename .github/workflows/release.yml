name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: jcode-mcp

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          fi
          STAGE_DIR="dist/${BINARY_NAME}-${TAG}-${{ matrix.target }}"
          mkdir -p "${STAGE_DIR}"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${STAGE_DIR}/"
          cp README.md LICENSE "${STAGE_DIR}/"
          ARCHIVE_NAME="${BINARY_NAME}-${TAG}-${{ matrix.target }}.tar.gz"
          tar -C dist -czf "dist/${ARCHIVE_NAME}" "${BINARY_NAME}-${TAG}-${{ matrix.target }}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256")
          else
            (cd dist && shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256")
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  publish:
    name: Publish GitHub Release & Homebrew Formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Homebrew Formula with SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          SHA_MAC_ARM="$(awk '{print $1}' "artifacts/${BINARY_NAME}-${TAG}-aarch64-apple-darwin.tar.gz.sha256")"
          SHA_MAC_X64="$(awk '{print $1}' "artifacts/${BINARY_NAME}-${TAG}-x86_64-apple-darwin.tar.gz.sha256")"
          SHA_LINUX_X64="$(awk '{print $1}' "artifacts/${BINARY_NAME}-${TAG}-x86_64-unknown-linux-gnu.tar.gz.sha256")"
          SHA_LINUX_ARM="$(awk '{print $1}' "artifacts/${BINARY_NAME}-${TAG}-aarch64-unknown-linux-gnu.tar.gz.sha256")"

          cat > artifacts/jcode-mcp.rb <<EOF
          class JcodeMcp < Formula
            desc "Rust RPC client and MCP server for operating jcode workspaces from Codex"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${VER}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/jcode-mcp-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_ARM}"
              else
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/jcode-mcp-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MAC_X64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/jcode-mcp-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              else
                url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/jcode-mcp-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
            end

            def install
              bin.install "jcode-mcp"
            end

            test do
              assert_match "jcode-mcp", shell_output("#{bin}/jcode-mcp --help")
            end
          end
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/jcode-mcp.rb

      - name: Sync Formula to bridge-for-codex/homebrew-tap
        if: ${{ env.HOMEBREW_TAP_TOKEN != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/bridge-for-codex/homebrew-tap.git" tap-repo
          cp artifacts/jcode-mcp.rb tap-repo/Formula/jcode-mcp.rb
          cd tap-repo
          if ! git diff --quiet; then
            git config user.name "Jcode Contributors"
            git config user.email "noreply@github.com"
            git add Formula/jcode-mcp.rb
            git commit -m "chore(formula): update jcode-mcp to ${TAG}"
            git push origin main
          fi
